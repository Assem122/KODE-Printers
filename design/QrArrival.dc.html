<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap">
  <style>
    body { margin: 0; background: #0b0e16; }
    a { color: #3a6fca; } a:hover { color: #2150a0; }
    .k { font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; }
    .lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #6e7a92; }
    .stat { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgb(255 255 255 / 6%); font-size: 13px; }
    .stat__k { color: #a8b3c7; }
    .stat__v { font-weight: 700; }
  </style>
</helmet>

<div class="k" style="width: 390px; height: 844px; background: #0b0e16; color: #f2f5fa; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 300px; overflow: hidden;">
    <div style="position: absolute; top: -120px; left: -60px; width: 520px; height: 320px; background: linear-gradient(120deg, #2150a0 0%, #173770 62%, transparent 62.4%); transform: rotate(-14deg); opacity: 0.5;"></div>
  </div>

  <div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 20px; flex-shrink: 0; position: relative;">
    <div style="width: 36px; height: 36px; border-radius: 999px; background: rgb(29 36 50 / 70%); border: 1px solid rgb(255 255 255 / 8%); display: flex; align-items: center; justify-content: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#f2f5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #8fb4f0;">Scanned sticker</div>
  </div>

  <div style="padding: 8px 20px 0; position: relative;">
    <div style="display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 12px; border-radius: 999px; background: rgb(22 185 121 / 12%); border: 1px solid rgb(22 185 121 / 30%); font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #16b979; margin-bottom: 14px;">
      <span style="width: 7px; height: 7px; border-radius: 999px; background: #16b979;"></span>
      Ready
    </div>

    <div style="font-size: 34px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.05;">Reception</div>
    <div style="font-size: 14px; color: #a8b3c7; margin-top: 8px;">HP LaserJet MFP M428fdw</div>
    <div style="font-size: 12px; color: #6e7a92; margin-top: 4px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;">10.4.2.18 &middot; Main Office</div>
  </div>

  <div style="flex-grow: 1; padding: 22px 20px 0; overflow: hidden;">
    <div style="border-radius: 16px; background: #11151f; border: 1px solid rgb(255 255 255 / 6%); box-shadow: inset 0 1px 0 rgb(255 255 255 / 7%); padding: 4px 16px 8px;">
      <div class="stat">
        <div class="stat__k">Black toner</div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 78px; height: 6px; border-radius: 999px; background: #1d2432; overflow: hidden;">
            <div style="width: 62%; height: 100%; background: #16b979;"></div>
          </div>
          <div class="stat__v">62%</div>
        </div>
      </div>
      <div class="stat">
        <div class="stat__k">Runs out in</div>
        <div class="stat__v">about 18 days</div>
      </div>
      <div class="stat">
        <div class="stat__k">Paper</div>
        <div class="stat__v">A4 &middot; both trays</div>
      </div>
      <div class="stat" style="border-bottom: none;">
        <div class="stat__k">Queue</div>
        <div class="stat__v">Nothing waiting</div>
      </div>
    </div>

    <div style="margin-top: 18px; display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #161b26; border: 1px solid rgb(255 255 255 / 6%);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6e7a92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <div style="font-size: 12px; color: #a8b3c7; line-height: 1.5;">This is the printer you are standing at. Everything below sends here.</div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 16px 20px calc(68px + 16px);">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 52px; border-radius: 10px; background: #fec015; color: #241a00; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 800;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#241a00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
        Print something here
      </div>
      <div style="height: 52px; border-radius: 10px; background: #1d2432; border: 1px solid rgb(255 255 255 / 10%); color: #f2f5fa; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#f2f5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M2 12h20"/></svg>
        Send the next scan to me
      </div>
    </div>
  </div>

  <div style="position: absolute; inset-inline: 0; bottom: 0; height: 68px; background: rgb(17 21 31 / 92%); border-top: 1px solid rgb(255 255 255 / 6%);"></div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
